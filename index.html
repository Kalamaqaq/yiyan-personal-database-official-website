<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>记忆库 · 把过去，还给你。</title>
    <meta
      name="description"
      content="一个不会帮你整理的私人记忆库。你在深夜随手扔进去的碎片，会在某一天自己回来找你。本地优先，数据在你自己的设备上；AI 只建议，从不动手。Android APK 12.6 MB，免费。"
    />
    <meta name="theme-color" content="#070A12" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./mascot-192.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="记忆库 · 把过去，还给你。" />
    <meta
      property="og:description"
      content="一个不会帮你整理的私人记忆库。整理，是遗忘的开始。"
    />
    <meta property="og:image" content="./og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html,
      body {
        margin: 0;
        background: #070a12;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #070a12;
        z-index: 99;
        transition: opacity 0.6s ease;
        font: 400 12px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #5b6479;
        letter-spacing: 0.22em;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot i {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #5b84ff;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <i></i>
      <span>图书馆开灯中</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
