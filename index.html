    <!--

      property="og:image"

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html,
      body {
        margin: 0;
        background: #070a12;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #070a12;
        z-index: 99;
        transition: opacity 0.6s ease;
        font: 400 12px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #5b6479;
        letter-spacing: 0.22em;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot i {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #5b84ff;
        animation: bootpulse 1.4s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <i></i>
      <span>图书馆开灯中</span>
    </div>
    <div id="root"></div>
    <noscript>
      <div
        style="max-width:44em;margin:0 auto;padding:14vh 24px;font:400 16px/1.9 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#a9b1c5"

        <p style="margin:0 0 14px">
          一个不会帮你整理的私人记忆库。你在某个深夜随手扔进去的一句话，会在某一天，自己回来找你。

        <p style="margin:0 0 14px">
          它不替你自动打标签，不逼你分类归档，也不把你的内容交给我们的服务器 ——
          数据存在你自己的设备上，AI 用你自己填的 Key。AI 只建议，动手的永远是你。

        <p style="margin:0 0 14px">

        </p>
        <p style="margin:0 0 22px">
          <a
            href="./download/yiyan-personal-database-v2.7.3-release.apk"
            style="display:inline-block;padding:14px 24px;border-radius:999px;background:#eef0f7;color:#06080f;text-decoration:none;font-weight:500"
            >下载 Android 版 · 12.5 MB</a
          >
        </p>
        <p style="font-size:13px;color:#737b91;margin:0">
          没有 iOS 版；云端备份要你自己填一个 token，且备忘录里的图片不参与备份；
          源码为 CC BY-NC 4.0，不可商用。以上是全部已知的硬伤。
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
