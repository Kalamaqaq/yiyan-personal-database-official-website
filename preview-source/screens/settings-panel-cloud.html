<div class="settings-panel-content"><h2 class="panel-title">云端备份</h2><div class="settings-subsection-title">中转站连接</div><div class="form-hint" style="margin-bottom: 10px;">为安全起见，安装包内<strong>不再内置任何密钥</strong>。请把你的中转站 token 填在这里（仅存本机）。</div><div class="form-group"><label class="form-label">中转站地址</label><input class="form-input" type="text" inputmode="url" placeholder="https://cloudflare.8765777.xyz" autocomplete="off" spellcheck="false" value=""><div class="form-hint">不用写 <code>https://</code>，会自动补全；留空则用默认地址</div></div><div class="form-group"><label class="form-label">中转站密钥（Token）</label><div style="display: flex; gap: 8px; align-items: center;"><input class="form-input" type="password" placeholder="粘贴你的中转站 token" autocomplete="off" spellcheck="false" value=""><button class="form-reset-btn" type="button" style="white-space: nowrap;">显示</button></div><div class="form-hint" style="color: var(--color-warning, #f59f00);">未填写密钥时，云备份 / 附件上传将无法使用。</div></div><div class="form-group"><label class="form-label">R2 附件公开域名</label><input class="form-input" type="text" placeholder="yiyanr2.8765777.xyz" autocomplete="off" spellcheck="false" value=""></div><div class="form-group"><button class="form-reset-btn" type="button" disabled="">配置已保存</button></div><hr style="border-top: 1px solid var(--color-border-primary); border-right-width: medium; border-bottom-width: medium; border-left-width: medium; border-right-style: none; border-bottom-style: none; border-left-style: none; border-right-color: currentcolor; border-bottom-color: currentcolor; border-left-color: currentcolor; border-image: none; margin: 16px 0px;"><div class="form-hint" style="margin-bottom: 12px;">Cloudflare D1 + R2 远程备份（中转站模式）</div><div class="form-group"><button class="form-reset-btn">初始化云端备份模块</button></div><div class="form-hint" style="font-size: 11px; color: var(--color-text-tertiary);">ℹ️ 点击按钮后才会加载云端备份模块，避免影响启动速度</div></div>
