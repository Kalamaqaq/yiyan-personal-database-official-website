<div class="settings-panel-content"><h2 class="panel-title">随机浏览</h2><div class="form-group"><label class="form-label">每屏随机卡片数</label><input type="number" class="form-input glass" min="1" max="50" step="1" value="7"><span class="form-hint">推荐 5-10 张，根据屏幕大小调整</span></div><div class="form-group"><label class="form-label">图片附件展示模式</label><div class="form-radio-group"><label class="form-radio-card active"><input type="radio" name="attachmentDisplayMode" value="inline" checked=""><span class="form-radio-title">原图直接展示</span><span class="form-radio-desc">卡片文本下方纵向堆叠图片，点击可全屏放大</span></label><label class="form-radio-card "><input type="radio" name="attachmentDisplayMode" value="badge"><span class="form-radio-title">仅显示附件标识</span><span class="form-radio-desc">卡片只显示附件数量徽标，点击弹出画廊查看</span></label></div><span class="form-hint">控制随机卡片中图片附件的展示方式</span></div><div class="form-group"><label class="form-label">长文本折叠字数</label><input type="number" class="form-input glass" min="0" max="5000" step="50" value="300"><span class="form-hint">超过该字数的卡片内容将折叠，点击「展开」查看全文；设为 0 表示不折叠</span></div></div>
